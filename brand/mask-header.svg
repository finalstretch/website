<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Height mask for the small header medallion: no rim lettering
       (illegible below ~200px), enlarged centre mark, deeper relief. -->
  <rect width="128" height="128" fill="#000000"/>

  <!-- raised outer rim band -->
  <circle cx="64" cy="64" r="61" fill="none" stroke="#ffffff" stroke-width="4"/>

  <g stroke="#ffffff" stroke-linecap="round" fill="none">
    <circle cx="91" cy="37" r="11" stroke-width="5.5"/>
    <line x1="77.5" y1="50.5" x2="69.5" y2="58.5" stroke-width="5.5" stroke-dasharray="0.3 10.8"/>
    <line x1="66" y1="62" x2="45.5" y2="82.5" stroke-width="7"/>
    <circle cx="37" cy="91" r="9.5" fill="#ffffff" stroke="none"/>
  </g>
</svg>
